name: ci

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

# `build` produces the artifact that `deploy` ships; `deploy` also waits for `test` (012 decisions
# #52; #48 had made tests non-gating while CI tests were red).
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Gallery.slnx -c Release -warnaserror

      - name: Publish
        run: dotnet publish src/Gallery.Web -c Release -o publish --no-build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: web
          path: publish
          retention-days: 7

  test:
    runs-on: ubuntu-24.04
    env:
      GALLERY_FFMPEG: /usr/bin/ffmpeg
      GALLERY_CWEBP: /usr/bin/cwebp
      # mongo:8 and 8.0 refuse the runner kernel (MongoDB SERVER-136848); 8.2 starts (012 decisions #51).
      GALLERY_MONGO_IMAGE: mongo:8.2
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install encoders
        run: sudo apt-get update && sudo apt-get install -y ffmpeg webp

      - name: Build
        run: dotnet build Gallery.slnx -c Release -warnaserror

      - name: Test
        run: dotnet test Gallery.slnx -c Release --no-build --blame-hang-timeout 180s

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: web
          path: publish

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: portfolio-web
          package: publish

      - name: Smoke test
        run: |
          for attempt in $(seq 1 10); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' https://port.zacal.me/ || true)
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "https://port.zacal.me/ did not answer 200 after 10 attempts"
          exit 1
