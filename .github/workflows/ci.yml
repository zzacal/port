name: ci

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install encoders and Docker runtime
        run: brew install ffmpeg webp colima docker

      - name: Start Colima
        run: |
          colima start --cpu 3 --memory 6
          echo "DOCKER_HOST=unix://$HOME/.colima/default/docker.sock" >> "$GITHUB_ENV"
          echo "TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE=/var/run/docker.sock" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build Gallery.slnx -c Release -warnaserror

      - name: Test
        run: dotnet test Gallery.slnx -c Release --no-build --blame-hang-timeout 180s

      - name: Publish
        run: dotnet publish src/Gallery.Web -c Release -o publish --no-build

      - name: Upload tested artifact
        uses: actions/upload-artifact@v7
        with:
          name: web
          path: publish
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download tested artifact
        uses: actions/download-artifact@v8
        with:
          name: web
          path: publish

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: portfolio-web
          package: publish

      - name: Smoke test
        run: |
          for attempt in $(seq 1 10); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' https://port.zacal.me/ || true)
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "https://port.zacal.me/ did not answer 200 after 10 attempts"
          exit 1
